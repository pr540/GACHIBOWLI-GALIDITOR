name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Type stripping is what lets packages/core run tests with no framework.
          node-version: 22.18
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run the money engine first and on its own. It needs no database and
      # takes about a second, so a break there fails the run before anything
      # slower gets a chance to.
      - name: Money engine
        run: pnpm --filter @splitbills/core test

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Build
        run: pnpm turbo build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: splitbills
          POSTGRES_PASSWORD: splitbills
          POSTGRES_DB: splitbills
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splitbills"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Proves the schema actually applies to a real Postgres, including the
      # pgvector HNSW index whose operator class drizzle-kit has gotten wrong before.
      - name: Apply schema
        run: pnpm db:push --force
        env:
          DATABASE_URL: postgresql://splitbills:splitbills@localhost:5432/splitbills
